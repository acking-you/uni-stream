[package]
authors = ['LB7666 <acking-you@foxmail.com>']
description = 'Provides universal stream for TCP and UDP traffic and custom DNS resolution service'
edition = '2021'
repository = 'https://github.com/acking-you/uni-stream'
license = 'MIT'
name = 'uni-stream'
version = '0.3.1'
keywords = ["stream", "udp", "tcp", "ip", "dns"]
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = "1.11.0"
hashbrown = "0.16"
tracing = "0.1.40"
socket2 = "0.6.0"
tokio = { version = "1", features = [
    "rt",
    "sync",
    "net",
    "macros",
    "io-util",
    "time",
] }
futures = "0.3.30"
once_cell = "1.18.0"
trust-dns-resolver = "0.23.2"
kanal = { git = "https://github.com/acking-you/kanal.git", branch = "dev/pb-mapper" }

[features]
default = ["udp-timeout"]
udp-timeout = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
